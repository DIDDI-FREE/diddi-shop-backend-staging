# Portainer stack for DiddiShop staging.
#
# Keep the API and the generated MkDocs portal in the same stack and deploy
# both from the same Git revision. This mirrors the DiddiGo deployment model:
# the public documentation always describes the API revision that is running.
#
# In Portainer, set the staging values explicitly:
#   DOCS_PUBLIC_ENABLED=true
#   DIDDI_SHOP_ENVIRONMENT=staging
#   DIDDI_SHOP_API_PORT=48180
#   DIDDI_SHOP_DOCS_PORT=48182
#
# Secrets and external integration URLs must be supplied through Portainer's
# environment/secrets configuration. No secret belongs in this file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diddishop}
      POSTGRES_USER: ${POSTGRES_USER:-diddishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - diddishop-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DIDDI_SHOP_ENVIRONMENT: ${DIDDI_SHOP_ENVIRONMENT:-staging}
      DIDDI_SHOP_DATABASE_URL: ${DIDDI_SHOP_DATABASE_URL:?Set DIDDI_SHOP_DATABASE_URL in Portainer}
      DIDDI_SHOP_REDIS_URL: ${DIDDI_SHOP_REDIS_URL:-redis://redis:6379/0}
      DIDDI_SHOP_INTERNAL_REQUEST_TIMEOUT_SECONDS: ${DIDDI_SHOP_INTERNAL_REQUEST_TIMEOUT_SECONDS:-5}
      # External URLs are passed explicitly from Portainer's stack environment;
      # Compose does not forward undeclared host variables automatically.
      DIDDI_SHOP_DIDDIFREEID_BASE_URL: ${DIDDI_SHOP_DIDDIFREEID_BASE_URL:-}
      DIDDI_SHOP_DIDDIFREEID_JWKS_URL: ${DIDDI_SHOP_DIDDIFREEID_JWKS_URL:-}
      DIDDI_SHOP_DIDDIPAY_BASE_URL: ${DIDDI_SHOP_DIDDIPAY_BASE_URL:-}
      DIDDI_SHOP_DIDDISEND_BASE_URL: ${DIDDI_SHOP_DIDDISEND_BASE_URL:-}
      DIDDI_SHOP_DIDDIFILES_BASE_URL: ${DIDDI_SHOP_DIDDIFILES_BASE_URL:-}
      DIDDI_SHOP_DIDDIFILES_S3_ENDPOINT: ${DIDDI_SHOP_DIDDIFILES_S3_ENDPOINT:-}
      DIDDI_SHOP_DIDDIREWARDS_BASE_URL: ${DIDDI_SHOP_DIDDIREWARDS_BASE_URL:-}
      DIDDI_SHOP_DIDDICOMMS_BASE_URL: ${DIDDI_SHOP_DIDDICOMMS_BASE_URL:-}
      DIDDI_SHOP_DIDDISUPPORT_BASE_URL: ${DIDDI_SHOP_DIDDISUPPORT_BASE_URL:-}
      DIDDI_SHOP_DIDDIOBSERVE_BASE_URL: ${DIDDI_SHOP_DIDDIOBSERVE_BASE_URL:-}
      DIDDI_SHOP_DIDDIFREEID_ISSUER: ${DIDDI_SHOP_DIDDIFREEID_ISSUER:-}
      DIDDI_SHOP_DIDDIFREEID_SERVICE_TOKEN_URL: ${DIDDI_SHOP_DIDDIFREEID_SERVICE_TOKEN_URL:-}
      DIDDI_SHOP_JWT_AUDIENCE: ${DIDDI_SHOP_JWT_AUDIENCE:-diddishop}
      DIDDI_SHOP_SERVICE_CLIENT_IDS: ${DIDDI_SHOP_SERVICE_CLIENT_IDS:-}
      DIDDI_SHOP_SERVICE_CLIENT_SECRETS: ${DIDDI_SHOP_SERVICE_CLIENT_SECRETS:-}
      DIDDI_SHOP_DIDDIPAY_WEBHOOK_SECRET: ${DIDDI_SHOP_DIDDIPAY_WEBHOOK_SECRET:-}
      DIDDI_SHOP_DIDDISEND_WEBHOOK_SECRET: ${DIDDI_SHOP_DIDDISEND_WEBHOOK_SECRET:-}
      DIDDI_SHOP_ORDER_SELLER_CONFIRMATION_HOURS: ${DIDDI_SHOP_ORDER_SELLER_CONFIRMATION_HOURS:-24}
      DIDDI_SHOP_CLAIM_WINDOW_HOURS: ${DIDDI_SHOP_CLAIM_WINDOW_HOURS:-72}
      DIDDI_SHOP_SELLER_RELEASE_DELAY_HOURS: ${DIDDI_SHOP_SELLER_RELEASE_DELAY_HOURS:-72}
      DIDDI_SHOP_SELLER_COMMISSION_BPS: ${DIDDI_SHOP_SELLER_COMMISSION_BPS:-1000}
      DIDDI_SHOP_SELLER_RELEASE_ENABLED: ${DIDDI_SHOP_SELLER_RELEASE_ENABLED:-false}
      # DiddiObserve uses its dedicated OTLP credential, never a business S2S
      # token. The values are injected by Portainer and are not committed.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-diddishop}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-staging}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-diddishop-staging}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
      OTEL_INSTANCE_ID: ${OTEL_INSTANCE_ID:-diddishop-staging-api}
      DIDDI_COMPONENT: ${DIDDI_COMPONENT:-api}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${DIDDI_SHOP_API_PORT:-48180}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    environment:
      # Keep false as the safe default. Staging must explicitly set true;
      # production should remain false unless publication is intentional.
      DOCS_PUBLIC_ENABLED: ${DOCS_PUBLIC_ENABLED:-false}
    ports:
      - "${DIDDI_SHOP_DOCS_PORT:-48182}:80"
    restart: unless-stopped

volumes:
  diddishop-postgres:
